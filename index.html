<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7EB8DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="amber的工作台">
<link rel="icon" href="/icons/icon-48x48.png">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">
<link rel="manifest" href="/manifest.json">
<title>amber的工作台</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-50:#E3F2FD;--blue-100:#BBDEFB;--blue-200:#90CAF9;--blue-300:#64B5F6;
  --blue-400:#7EB8DA;--blue-500:#5C9EC4;
  --pink-50:#FCE4EC;--pink-100:#F8BBD0;--pink-200:#F48FB1;--pink-300:#F06292;
  --pink-400:#EC7FA0;--pink-500:#D4687C;
  --white:#FFFFFF;--gray-50:#FAFAFA;--gray-100:#F5F5F5;--gray-200:#EEEEEE;
  --gray-300:#E0E0E0;--gray-400:#BDBDBD;--gray-500:#9E9E9E;
  --gray-700:#616161;--gray-900:#212121;
  --radius:14px;--radius-sm:10px;--radius-xs:8px;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 30px rgba(0,0,0,.08);
  --sidebar-w:200px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:linear-gradient(135deg,var(--blue-50) 0%,var(--pink-50) 100%);
  min-height:100vh;min-height:100dvh;
  color:var(--gray-900);
  -webkit-font-smoothing:antialiased;
}

/* ===== Desktop Top Bar ===== */
.desktop-topbar{
  display:none;
  height:36px;background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.05);
  align-items:center;justify-content:space-between;
  padding:0 20px;position:sticky;top:0;z-index:60;
}

/* ===== Sync Pill ===== */
.sync-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 14px;border-radius:20px;
  font-size:12px;font-weight:600;letter-spacing:.3px;
  transition:all .3s;cursor:default;user-select:none;
}
.sync-pill.online{background:#E8F5E9;color:#2E7D32}
.sync-pill.offline{background:var(--gray-100);color:var(--gray-500)}
.sync-pill.syncing{background:var(--blue-50);color:var(--blue-500)}
.sync-pill.error{background:#FFF3E0;color:#E65100}
.sync-pill-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:all .3s;
}
.sync-pill.online .sync-pill-dot{background:#4CAF50;box-shadow:0 0 6px rgba(76,175,80,.4)}
.sync-pill.offline .sync-pill-dot{background:var(--gray-400)}
.sync-pill.syncing .sync-pill-dot{background:var(--blue-400);animation:pulse 1s infinite}
.sync-pill.error .sync-pill-dot{background:#FF9800}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-test-btn{
  margin-left:4px;padding:2px 10px;border-radius:10px;border:1px solid var(--gray-300);
  background:var(--white);font-size:11px;color:var(--gray-700);cursor:pointer;
  font-family:inherit;transition:all .2s;display:none;
}
.sync-pill.offline .sync-test-btn,.sync-pill.error .sync-test-btn{display:inline-block}
.sync-test-btn:hover{border-color:var(--blue-300);color:var(--blue-500);background:var(--blue-50)}
.sync-test-result{
  font-size:11px;color:var(--gray-500);margin-top:2px;display:none;text-align:center;
}
.sync-test-result.show{display:block}

/* ===== App Shell ===== */
.app{display:flex;min-height:calc(100vh - 36px);min-height:calc(100dvh - 36px)}

/* ===== Sidebar ===== */
.sidebar{
  width:var(--sidebar-w);background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid rgba(0,0,0,.06);
  display:flex;flex-direction:column;flex-shrink:0;
  position:sticky;top:36px;height:calc(100vh - 36px);height:calc(100dvh - 36px);
  z-index:50;transition:transform .3s;
}
.sidebar-brand{
  padding:18px 18px 12px;border-bottom:1px solid var(--gray-100);
  display:flex;align-items:center;gap:10px;
}
.sidebar-icon{
  width:32px;height:32px;border-radius:9px;background:var(--blue-400);
  color:var(--white);display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;letter-spacing:-.5px;flex-shrink:0;
}
.sidebar-brand-text{font-size:15px;font-weight:700;letter-spacing:-.3px}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-radius:10px;border:none;background:transparent;
  font-size:14px;font-weight:500;color:var(--gray-700);cursor:pointer;
  transition:all .2s;width:100%;text-align:left;font-family:inherit;
}
.nav-item:hover{background:var(--blue-50);color:var(--blue-500)}
.nav-item.active{background:var(--blue-100);color:var(--blue-500);font-weight:600}
.nav-emoji{font-size:18px;flex-shrink:0}
.sidebar-footer{
  padding:12px 10px 16px;border-top:1px solid var(--gray-100);
}
.btn-settings{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 14px;
  border-radius:10px;border:none;background:transparent;
  font-size:13px;color:var(--gray-500);cursor:pointer;font-family:inherit;
  transition:all .2s;
}
.btn-settings:hover{background:var(--gray-100)}

/* ===== Main Content ===== */
.main{
  flex:1;display:flex;flex-direction:column;min-width:0;
  padding:20px 28px 40px;gap:20px;overflow-y:auto;
}
.page{display:none;flex-direction:column;gap:20px}
.page.active{display:flex}

/* ===== Mobile Top Bar ===== */
.topbar{
  display:none;align-items:center;justify-content:space-between;
  padding:10px 16px;background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  position:sticky;top:0;z-index:100;gap:8px;
}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0}
.topbar-icon{
  width:28px;height:28px;border-radius:7px;background:var(--blue-400);color:var(--white);
  display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;
}
.topbar-title{font-size:15px;font-weight:700;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.menu-btn{
  width:32px;height:32px;border-radius:50%;border:none;
  background:var(--gray-100);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ===== Mobile Nav ===== */
.mobile-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.95);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.06);
  padding:6px 10px env(safe-area-inset-bottom,10px);
}
.mobile-nav-items{display:flex;gap:2px}
.mobile-nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border-radius:10px;border:none;background:transparent;
  font-size:10px;color:var(--gray-500);cursor:pointer;font-family:inherit;
  transition:all .2s;
}
.mobile-nav-item .mni-icon{font-size:20px}
.mobile-nav-item.active{color:var(--blue-500);background:var(--blue-50)}

/* ===== Cards ===== */
.card{
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.04);
  transition:box-shadow .3s;
}
.card:hover{box-shadow:var(--shadow-lg)}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid var(--gray-200);
}
.card-title{font-size:15px;font-weight:600;color:var(--gray-700);display:flex;align-items:center;gap:8px}
.card-body{flex:1;overflow-y:auto;min-height:0}

/* ===== Calendar Card ===== */
.calendar-card{border-top:3px solid var(--blue-300)}
.cal-nav{display:flex;align-items:center;gap:12px}
.cal-nav button{
  padding:6px 14px;border-radius:8px;border:1.5px solid var(--gray-200);
  background:var(--white);font-size:13px;cursor:pointer;font-family:inherit;
  color:var(--gray-700);transition:all .2s;
}
.cal-nav button:hover{border-color:var(--blue-300);color:var(--blue-500)}
.cal-nav .cal-today{background:var(--blue-400);color:var(--white);border-color:var(--blue-400)}
.cal-nav .cal-today:hover{background:var(--blue-500)}
.cal-month-label{font-size:15px;font-weight:600;color:var(--gray-700);min-width:100px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-weekday{
  font-size:11px;font-weight:600;color:var(--gray-400);
  padding:6px 0;text-transform:uppercase;letter-spacing:.5px;
}
.cal-day{
  aspect-ratio:1;border-radius:var(--radius-xs);padding:5px 3px;
  cursor:pointer;transition:all .2s;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  font-size:13px;font-weight:500;color:var(--gray-700);
  border:1.5px solid transparent;min-height:0;
}
.cal-day:hover{background:var(--blue-50);border-color:var(--blue-200)}
.cal-day.today{
  background:var(--blue-100);border-color:var(--blue-300);
  font-weight:700;color:var(--blue-500);
}
.cal-day.other-month{color:var(--gray-300)}
.cal-day-num{font-size:13px;line-height:1}
.cal-day-dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center}
.cal-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
}
.cal-dot.plan{background:var(--pink-300)}
.cal-dot.event{background:var(--blue-400)}
.cal-dot.checkin{background:#4CAF50}

/* ===== Daily Plans ===== */
.plan-card{border-top:3px solid var(--pink-300)}
.plan-date-header{
  display:flex;align-items:center;gap:12px;margin-bottom:14px;
}
.plan-date-header button{
  width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gray-200);
  background:var(--white);font-size:16px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;color:var(--gray-700);transition:all .2s;
}
.plan-date-header button:hover{border-color:var(--blue-300);color:var(--blue-500)}
.plan-date-label{font-size:15px;font-weight:600;color:var(--gray-700);min-width:140px;text-align:center}
.plan-input-wrap{display:flex;gap:8px;margin-bottom:14px}
.plan-input{
  flex:1;border:1.5px solid var(--gray-200);border-radius:var(--radius-xs);
  padding:10px 14px;font-size:14px;outline:none;font-family:inherit;
  background:var(--gray-50);transition:border-color .2s;
}
.plan-input:focus{border-color:var(--pink-300);background:var(--white)}
.btn-add{
  padding:10px 18px;border:none;border-radius:var(--radius-xs);
  background:var(--pink-300);color:var(--white);
  font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.btn-add:hover{background:var(--pink-400)}
.plan-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.plan-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:var(--radius-xs);background:var(--gray-50);transition:all .2s;
}
.plan-item:hover{background:var(--pink-50)}
.plan-check{
  width:22px;height:22px;border-radius:5px;border:2px solid var(--gray-300);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;background:var(--white);
}
.plan-check:hover{border-color:var(--pink-300);background:var(--pink-50)}
.plan-item.done .plan-check{background:var(--pink-300);border-color:var(--pink-300)}
.plan-check::after{content:'✓';font-size:12px;color:var(--white);opacity:0;transition:opacity .15s;font-weight:700}
.plan-item.done .plan-check::after{opacity:1}

/* ===== Plan Sections (4-group layout) ===== */
.plan-section{margin-bottom:4px}
.plan-section-header{
  font-size:12px;font-weight:600;color:var(--gray-500);
  padding:8px 14px 6px;display:flex;align-items:center;gap:6px;
  letter-spacing:.5px;text-transform:uppercase;
}
.plan-section-header .sec-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0}
.plan-section-header .sec-count{font-weight:400;color:var(--gray-400);margin-left:auto;font-size:11px}
.plan-section.overdue .sec-dot{background:#FF9800}
.plan-section.today-sec .sec-dot{background:var(--pink-300)}
.plan-section.done-sec .sec-dot{background:#4CAF50}
.plan-section.future-sec .sec-dot{background:var(--blue-300)}
.plan-section.overdue .plan-item{background:#FFF8E1}
.plan-section.today-sec .plan-item{background:var(--pink-50)}
.plan-section.done-sec .plan-item{background:#E8F5E9}
.plan-section.future-sec .plan-item{background:var(--blue-50)}

/* ===== Stats Cards (square, text top + number bottom) ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{
  background:rgba(255,255,255,.9);border-radius:12px;
  padding:14px 10px;text-align:center;
  box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.04);
  transition:all .2s;cursor:default;display:flex;flex-direction:column;
  align-items:center;justify-content:center;aspect-ratio:1;
}
.stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.stat-card.orange{border-top:3px solid #FF9800}
.stat-card.pink{border-top:3px solid var(--pink-300)}
.stat-card.green{border-top:3px solid #4CAF50}
.stat-card.blue{border-top:3px solid var(--blue-300)}
.stat-label{font-size:11px;font-weight:500;color:var(--gray-500);margin-bottom:4px;letter-spacing:.3px}
.stat-value{font-size:26px;font-weight:700;color:var(--gray-900);letter-spacing:-1px}
.stat-card.orange .stat-value{color:#E65100}
.stat-card.pink .stat-value{color:var(--pink-500)}
.stat-card.green .stat-value{color:#2E7D32}
.stat-card.blue .stat-value{color:var(--blue-500)}

/* ===== Add Plan Button Bottom ===== */
.plan-add-bottom{
  display:flex;gap:8px;padding:12px 0 0;margin-top:8px;
  border-top:2px dashed var(--gray-200);
}
.plan-add-bottom input{
  flex:1;border:1.5px solid var(--gray-200);border-radius:var(--radius-xs);
  padding:10px 14px;font-size:14px;outline:none;font-family:inherit;
  background:var(--gray-50);transition:border-color .2s;
}
.plan-add-bottom input:focus{border-color:var(--pink-300);background:var(--white)}
.plan-add-bottom .btn-add{
  padding:10px 18px;border:none;border-radius:var(--radius-xs);
  background:var(--pink-300);color:var(--white);
  font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.plan-add-bottom .btn-add:hover{background:var(--pink-400)}

/* ===== Overview Stats Row ===== */
.ov-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.plan-text{flex:1;font-size:14px;transition:all .2s}
.plan-item.done .plan-text{text-decoration:line-through;color:var(--gray-400)}
.plan-del{
  width:26px;height:26px;border-radius:50%;border:none;
  background:transparent;color:var(--gray-400);cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;opacity:0;
}
.plan-item:hover .plan-del{opacity:1}
.plan-del:hover{background:#FFEBEE;color:#F44336}
.plan-empty{text-align:center;color:var(--gray-400);font-size:13px;padding:20px 0}
.plan-progress{font-size:12px;color:var(--gray-400);display:flex;align-items:center;gap:6px}
.plan-progress-bar{
  width:60px;height:4px;border-radius:2px;background:var(--gray-200);overflow:hidden;
}
.plan-progress-fill{height:100%;background:var(--pink-300);border-radius:2px;transition:width .3s}

/* ===== Events ===== */
.event-card{border-top:3px solid var(--blue-300)}
.event-input-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.event-input-row input{
  border:1.5px solid var(--gray-200);border-radius:var(--radius-xs);
  padding:9px 12px;font-size:13px;outline:none;font-family:inherit;
  background:var(--gray-50);transition:border-color .2s;
}
.event-input-row input:focus{border-color:var(--blue-300);background:var(--white)}
.ev-date{flex:1;min-width:100px}
.ev-time{flex:1;min-width:80px}
.ev-title{flex:2;min-width:120px}
.ev-desc{width:100%}
.event-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.event-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:var(--radius-xs);background:var(--gray-50);transition:all .2s;
  border-left:3px solid var(--blue-300);
}
.event-item:hover{background:var(--blue-50)}
.event-info{flex:1;min-width:0}
.event-title{font-size:14px;font-weight:500}
.event-meta{font-size:11px;color:var(--gray-400);margin-top:2px}
.event-desc-text{font-size:12px;color:var(--gray-500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-del{
  width:26px;height:26px;border-radius:50%;border:none;
  background:transparent;color:var(--gray-400);cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;opacity:0;flex-shrink:0;
}
.event-item:hover .event-del{opacity:1}
.event-del:hover{background:#FFEBEE;color:#F44336}

/* ===== Check-in ===== */
.checkin-card{border-top:3px solid #4CAF50}
.checkin-add-wrap{display:flex;gap:8px;margin-bottom:16px}
.checkin-add-wrap input{
  flex:1;border:1.5px solid var(--gray-200);border-radius:var(--radius-xs);
  padding:10px 14px;font-size:14px;outline:none;font-family:inherit;
  background:var(--gray-50);transition:border-color .2s;
}
.checkin-add-wrap input:focus{border-color:#4CAF50;background:var(--white)}
.btn-checkin-add{
  padding:10px 18px;border:none;border-radius:var(--radius-xs);
  background:#4CAF50;color:var(--white);
  font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.btn-checkin-add:hover{background:#43A047}
.checkin-habits{display:flex;flex-direction:column;gap:12px}
.checkin-habit{
  background:var(--gray-50);border-radius:var(--radius-sm);padding:14px;transition:all .2s;
}
.checkin-habit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.checkin-habit-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.checkin-habit-name .emoji{font-size:18px}
.checkin-streak{
  font-size:11px;color:#4CAF50;font-weight:600;
  background:#E8F5E9;padding:3px 10px;border-radius:12px;
}
.checkin-days{display:flex;gap:3px;flex-wrap:wrap}
.checkin-day{
  width:28px;height:28px;border-radius:6px;border:1.5px solid var(--gray-200);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:11px;transition:all .2s;background:var(--white);
  color:var(--gray-500);position:relative;
}
.checkin-day:hover{border-color:#4CAF50}
.checkin-day.checked{background:#4CAF50;border-color:#4CAF50;color:var(--white)}
.checkin-day.today{border-color:#4CAF50;border-width:2px;font-weight:700}
.checkin-habit-del{
  width:26px;height:26px;border-radius:50%;border:none;
  background:transparent;color:var(--gray-400);cursor:pointer;
  font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.checkin-habit-del:hover{background:#FFEBEE;color:#F44336}

/* ===== Overview Modules ===== */
.overview-modules{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ov-module{
  background:rgba(255,255,255,.85);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.04);
  cursor:pointer;transition:all .2s;
}
.ov-module:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.ov-module-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ov-module-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.ov-module-badge{
  font-size:11px;padding:2px 8px;border-radius:10px;
  font-weight:600;
}
.ov-module-badge.blue{background:var(--blue-100);color:var(--blue-500)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// amber的工作台 v3 — 墓碑同步引擎 + 顶栏状态药丸
// ============================================================

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const LS_KEYS = {
  plans: 'amber_plans_v3', events: 'amber_events_v3', checkins: 'amber_checkins_v3',
  links: 'amber_links_v3', config: 'amber_config',
  deviceId: 'amber_device_id',
};

// --- State ---
let state = {
  currentPage: 'overview',
  calStartDate: null,
  planSelectedDate: fmtDate(new Date()),
  plans: [],
  events: [],
  checkins: [],
  links: [],
};

// ============================================================
// DEVICE ID + SUPABASE CLIENT
// ============================================================
let DEVICE_ID = localStorage.getItem(LS_KEYS.deviceId);
if (!DEVICE_ID) { DEVICE_ID = 'd_' + crypto.randomUUID(); localStorage.setItem(LS_KEYS.deviceId, DEVICE_ID); }

let supabase = null;
let syncEnabled = false;

function initSupabase() {
  try {
    const cfg = JSON.parse(localStorage.getItem(LS_KEYS.config) || '{}');
    if (cfg.url && cfg.key) {
      supabase = window.supabase.createClient(cfg.url, cfg.key);
      syncEnabled = true;
      return true;
    }
  } catch(e) {}
  supabase = null;
  syncEnabled = false;
  return false;
}

// ============================================================
// SYNC PILL — 统一管理桌面端和手机端的状态药丸
// ============================================================
const pillEls = {
  desktop: null, mobile: null,
  labelDesktop: null, labelMobile: null,
  testBtnDesktop: null, testBtnMobile: null,
};
function initSyncPills() {
  pillEls.desktop = $('#syncPillDesktop');
  pillEls.mobile = $('#syncPillMobile');
  pillEls.labelDesktop = $('#syncLabelDesktop');
  pillEls.labelMobile = $('#syncLabelMobile');
  pillEls.testBtnDesktop = $('#syncTestBtnDesktop');
  pillEls.testBtnMobile = $('#syncTestBtnMobile');
}

function setSyncStatus(status, label) {
  [pillEls.desktop, pillEls.mobile].forEach(el => {
    if (!el) return;
    el.className = 'sync-pill ' + status;
  });
  [pillEls.labelDesktop, pillEls.labelMobile].forEach(el => {
    if (el) el.textContent = label;
  });
}

// ============================================================
// TOMBSTONE SYNC ENGINE
// ============================================================

// Map state keys to Supabase table names
const TABLE_MAP = { plans: 'plans', events: 'events', checkins: 'checkins', links: 'links' };

function withDeviceId(record) {
  return { ...record, device_id: DEVICE_ID };
}

/** Pull all records from a Supabase table (including tombstones) */
async function cloudPull(tableName) {
  if (!supabase) return [];
  const { data, error } = await supabase.from(tableName).select('*').order('updated_at', { ascending: false });
  if (error) { console.warn('Pull error', tableName, error.message); return []; }
  return data || [];
}

/** Push (upsert) records to cloud */
async function cloudPush(tableName, records) {
  if (!supabase || !records.length) return;
  const { error } = await supabase.from(tableName).upsert(records);
  if (error) console.warn('Push error', tableName, error.message);
}

/** Mark a record as deleted (tombstone) in cloud */
async function cloudTombstone(tableName, id) {
  if (!supabase) return;
  const now = new Date().toISOString();
  const { error } = await supabase.from(tableName).update({ deleted_at: now, updated_at: now }).eq('id', id);
  if (error) console.warn('Tombstone error', tableName, error.message);
}

/**
 * Full merge: pull cloud → apply tombstones → merge non-tombstone → push local-only
 * Returns merged local data (active records only, no tombstones)
 */
async function fullSync(key) {
  if (!syncEnabled || !supabase) return;

  const tableName = TABLE_MAP[key];
  if (!tableName) return;

  try {
    // 1. Pull all records from cloud
    const cloudRecords = await cloudPull(tableName);
    if (!cloudRecords.length) {
      // No cloud data — push all local to cloud
      const localData = state[key].map(withDeviceId);
      if (localData.length) await cloudPush(tableName, localData);
      setSyncStatus('online', '已同步');
      return;
    }

    // 2. Build lookup maps
    const localMap = {};
    state[key].forEach(r => { localMap[r.id] = r; });

    const cloudMap = {};
    cloudRecords.forEach(r => { cloudMap[r.id] = r; });

    // 3. Apply tombstones: remove local records that are tombstoned in cloud
    const cloudTombstones = cloudRecords.filter(r => r.deleted_at);
    const tombstoneIds = new Set(cloudTombstones.map(r => r.id));

    // 4. Merge non-tombstone cloud records into local
    const mergedMap = { ...localMap };
    const toPush = [];

    cloudRecords.filter(r => !r.deleted_at).forEach(cr => {
      const local = mergedMap[cr.id];
      if (!local) {
        // New from cloud — add to local
        mergedMap[cr.id] = cr;
      } else {
        // Both exist — newer updated_at wins
        const cloudTime = new Date(cr.updated_at || 0).getTime();
        const localTime = new Date(local.updated_at || 0).getTime();
        if (cloudTime > localTime) {
          mergedMap[cr.id] = { ...local, ...cr, id: cr.id }; // cloud wins but keep local shape
        }
      }
    });

    // 5. Push local-only records (not in cloud at all)
    Object.values(localMap).forEach(lr => {
      if (!cloudMap[lr.id]) {
        toPush.push(withDeviceId(lr));
      }
    });

    // 6. Remove tombstoned records from merged
    tombstoneIds.forEach(id => { delete mergedMap[id]; });

    // 7. Update state
    const merged = Object.values(mergedMap).filter(r => !r.deleted_at);
    state[key] = merged;
    saveLocal(key, merged);

    // 8. Push local-only records
    if (toPush.length) await cloudPush(tableName, toPush);

    // 9. If we tombstoned locally, push those too (already handled by the caller)
    setSyncStatus('online', '已同步');
  } catch(e) {
    console.warn('FullSync error', key, e.message);
    setSyncStatus('error', '同步失败');
  }
}

/** Debounced full sync for a table */
const syncTimers = {};
function debouncedSync(key) {
  clearTimeout(syncTimers[key]);
  syncTimers[key] = setTimeout(() => fullSync(key), 800);
}

// ============================================================
// CRUD with Tombstone Support
// ============================================================

function saveLocal(key, data) {
  const lsKey = LS_KEYS[key];
  if (lsKey) localStorage.setItem(lsKey, JSON.stringify(data));
}

function createRecord(key, record) {
  const now = new Date().toISOString();
  const rec = { ...record, created_at: record.created_at || now, updated_at: now };
  state[key].push(rec);
  saveLocal(key, state[key]);

  if (syncEnabled) {
    cloudPush(TABLE_MAP[key], [withDeviceId(rec)]).then(() => setSyncStatus('online', '已同步'));
  }
}

function updateRecord(key, id, updates) {
  const rec = state[key].find(r => r.id === id);
  if (!rec) return;
  Object.assign(rec, updates, { updated_at: new Date().toISOString() });
  saveLocal(key, state[key]);

  if (syncEnabled) {
    cloudPush(TABLE_MAP[key], [withDeviceId(rec)]).then(() => setSyncStatus('online', '已同步'));
  }
}

function deleteRecord(key, id) {
  const now = new Date().toISOString();
  const rec = state[key].find(r => r.id === id);
  if (!rec) return;

  // TOMBSTONE: set deleted_at instead of splicing
  rec.deleted_at = now;
  rec.updated_at = now;
  saveLocal(key, state[key]);

  // Remove from display immediately
  state[key] = state[key].filter(r => r.id !== id);
  // But keep the tombstoned record in localStorage for sync reference
  const allRecords = JSON.parse(localStorage.getItem(LS_KEYS[key]) || '[]');
  const idx = allRecords.findIndex(r => r.id === id);
  if (idx >= 0) {
    allRecords[idx].deleted_at = now;
    allRecords[idx].updated_at = now;
  } else {
    allRecords.push({ ...rec, deleted_at: now, updated_at: now });
  }
  localStorage.setItem(LS_KEYS[key], JSON.stringify(allRecords));

  if (syncEnabled) {
    cloudTombstone(TABLE_MAP[key], id).then(() => setSyncStatus('online', '已同步'));
  }
}

// ============================================================
// INIT + DATA LOAD
// ============================================================
async function init() {
  initSyncPills();
  const hasConfig = initSupabase();

  loadLocalData();
  initCalendar();
  initNavigation();

  // Render immediately from local
  renderAll();

  // Then sync from cloud in background
  if (hasConfig) {
    setSyncStatus('syncing', '同步中...');
    try {
      await Promise.all([
        fullSync('plans'), fullSync('events'), fullSync('checkins'), fullSync('links'),
      ]);
      // After merge, re-render
      renderAll();
    } catch(e) {
      console.warn('Initial sync failed', e.message);
      setSyncStatus('error', '同步失败');
    }
  }

  // Periodic cleanup of old tombstones (>30 days)
  cleanupOldTombstones();
  // Periodic background sync every 5 min
  setInterval(periodicSync, 300000);

  monitorOnline();
  registerSW();
}

function loadLocalData() {
  try { state.plans = JSON.parse(localStorage.getItem(LS_KEYS.plans) || '[]').filter(r => !r.deleted_at); } catch(e) { state.plans = []; }
  try { state.events = JSON.parse(localStorage.getItem(LS_KEYS.events) || '[]').filter(r => !r.deleted_at); } catch(e) { state.events = []; }
  try { state.checkins = JSON.parse(localStorage.getItem(LS_KEYS.checkins) || '[]').filter(r => !r.deleted_at); } catch(e) { state.checkins = []; }
  try { state.links = JSON.parse(localStorage.getItem(LS_KEYS.links) || '[]').filter(r => !r.deleted_at); } catch(e) { state.links = []; }
}

function renderAll() {
  renderCalendar();
  renderOvStats();
  if (state.currentPage === 'overview' || state.currentPage === 'plans') renderPlanPage();
  if (state.currentPage === 'overview' || state.currentPage === 'events') renderEventPage();
  if (state.currentPage === 'overview' || state.currentPage === 'checkins') renderCheckinPage();
  renderOverviewModules();
}

async function periodicSync() {
  if (!syncEnabled) return;
  setSyncStatus('syncing', '同步中...');
  try {
    await Promise.all([
      fullSync('plans'), fullSync('events'), fullSync('checkins'), fullSync('links'),
    ]);
    renderAll();
  } catch(e) {
    setSyncStatus('error', '同步失败');
  }
}

function cleanupOldTombstones() {
  const thirtyDaysAgo = new Date(Date.now() - 30 * 86400000).toISOString();
  ['plans', 'events', 'checkins', 'links'].forEach(key => {
    try {
      const all = JSON.parse(localStorage.getItem(LS_KEYS[key]) || '[]');
      const cleaned = all.filter(r => !r.deleted_at || r.deleted_at > thirtyDaysAgo);
      if (cleaned.length !== all.length) {
        localStorage.setItem(LS_KEYS[key], JSON.stringify(cleaned));
      }
    } catch(e) {}
  });
}

// ============================================================
// CONNECTION DIAGNOSTICS
// ============================================================

async function testConnection() {
  if (!supabase) {
    showDiagToast('未配置 Supabase，请先在设置中填写 URL 和 Key', 'error');
    return;
  }
  showDiagToast('正在检测连接...', 'syncing');

  try {
    // Test 1: Basic connectivity
    const { error: e1 } = await supabase.from('plans').select('id').limit(1);
    if (e1) {
      if (e1.code === '42P01') {
        showDiagToast('表不存在 — 请先在 Supabase SQL Editor 中执行 supabase-setup.sql', 'error');
      } else if (e1.message?.includes('JWT')) {
        showDiagToast('Anon Key 无效 — 请检查是否正确复制', 'error');
      } else {
        showDiagToast('连接失败: ' + (e1.message || '未知错误'), 'error');
      }
      return;
    }

    // Test 2: Check table count
    const { data, error: e2 } = await supabase.from('plans').select('id', { count: 'exact', head: true });
    if (e2) {
      showDiagToast('连接成功但查询失败 — 请检查 RLS 策略', 'error');
      return;
    }

    setSyncStatus('online', '已同步');
    showDiagToast('连接成功 ✓ — 云端同步已就绪', 'online');

    // Do a full sync after successful test
    fullSync('plans'); fullSync('events'); fullSync('checkins'); fullSync('links');
  } catch(e) {
    showDiagToast('网络错误 — 无法连接到 Supabase，请检查网络', 'error');
  }
}

let diagTimer;
function showDiagToast(msg, status) {
  const toast = $('#diagToast');
  if (!toast) return;
  toast.textContent = msg;
  toast.style.display = 'block';
  toast.style.background = status === 'online' ? '#E8F5E9' : status === 'error' ? '#FFEBEE' : '#E3F2FD';
  toast.style.color = status === 'online' ? '#2E7D32' : status === 'error' ? '#C62828' : '#1565C0';
  clearTimeout(diagTimer);
  diagTimer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
}

function monitorOnline() {
  const update = () => {
    if (!navigator.onLine) {
      setSyncStatus('offline', '断网');
    } else if (syncEnabled) {
      // Already handled by init/fullSync
    } else {
      setSyncStatus('offline', '仅本地');
    }
  };
  window.addEventListener('online', () => {
    setSyncStatus('syncing', '同步中...');
    periodicSync();
  });
  window.addEventListener('offline', () => setSyncStatus('offline', '断网'));
  update();
}

function initCalendar() {
  state.calStartDate = getMondayOfWeek(new Date());
  $('#calWeekdays').innerHTML = ['一','二','三','四','五','六','日'].map(d => `<div class="cal-weekday">${d}</div>`).join('');
  $('#calPrev').addEventListener('click', () => {
    state.calStartDate = new Date(state.calStartDate.getTime() - 35 * 86400000);
    renderCalendar();
  });
  $('#calNext').addEventListener('click', () => {
    state.calStartDate = new Date(state.calStartDate.getTime() + 35 * 86400000);
    renderCalendar();
  });
  $('#calToday').addEventListener('click', () => {
    state.calStartDate = getMondayOfWeek(new Date());
    renderCalendar();
  });
}

function getMondayOfWeek(d) {
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function renderCalendar() {
  const start = state.calStartDate;
  const endDate = new Date(start.getTime() + 34 * 86400000);
  const today = fmtDate(new Date());
  const startMonth = start.getMonth(), endMonth = endDate.getMonth();
  const startYear = start.getFullYear(), endYear = endDate.getFullYear();
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let label = (startMonth === endMonth && startYear === endYear)
    ? `${startYear}年 ${months[startMonth]}` : `${months[startMonth]} - ${months[endMonth]}`;
  $('#calMonthLabel').textContent = label;

  const planCounts = {}, eventCounts = {}, checkinCounts = {};
  state.plans.filter(p => !p.done).forEach(p => { planCounts[p.date] = (planCounts[p.date]||0) + 1; });
  state.events.forEach(e => { eventCounts[e.date] = (eventCounts[e.date]||0) + 1; });
  state.checkins.forEach(h => { (h.dates || []).forEach(d => { checkinCounts[d] = (checkinCounts[d]||0) + 1; }); });

  const grid = $('#calGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 35; i++) {
    const d = new Date(start.getTime() + i * 86400000);
    const dateStr = fmtDate(d), dayNum = d.getDate();
    const isToday = dateStr === today;
    const isOtherMonth = d.getMonth() !== startMonth && d.getMonth() !== endMonth;
    const nPlans = planCounts[dateStr] || 0, nEvents = eventCounts[dateStr] || 0, nCheckins = checkinCounts[dateStr] || 0;
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isOtherMonth) cls += ' other-month';
    let dots = '';
    for (let j = 0; j < nPlans; j++) dots += '<span class="cal-dot plan"></span>';
    for (let j = 0; j < nEvents; j++) dots += '<span class="cal-dot event"></span>';
    for (let j = 0; j < Math.min(nCheckins, 2); j++) dots += '<span class="cal-dot checkin"></span>';
    grid.innerHTML += `<div class="${cls}" data-date="${dateStr}" onclick="navigateToDate('${dateStr}')"><span class="cal-day-num">${dayNum}</span><div class="cal-day-dots">${dots}</div></div>`;
  }
}

function getPlanSections(dateStr) {
  const today = fmtDate(new Date());
  const overdue = [];  // 未完成：过去日期未完成 → 自动滚动到当天
  const todayTasks = []; // 今日任务：当天日期未完成
  const doneTasks = [];  // 已完成
  const futureTasks = []; // 待完成：未来日期

  state.plans.forEach(p => {
    if (p.done) {
      // Show done items only if they match the selected date (for context)
      if (p.date === dateStr) doneTasks.push(p);
    } else if (p.date < dateStr) {
      overdue.push(p);
    } else if (p.date === dateStr) {
      todayTasks.push(p);
    } else {
      futureTasks.push(p);
    }
  });

  return { overdue, todayTasks, doneTasks, futureTasks };
}

function renderPlanStats(dateStr) {
  const { overdue, todayTasks, doneTasks, futureTasks } = getPlanSections(dateStr);
  const total = overdue.length + todayTasks.length + doneTasks.length + futureTasks.length;

    <div class="stat-card blue"><div class="stat-label">待完成</div><div class="stat-value">${futureTasks.length}</div></div>`;
}

function calcStreak(dates) {
  if (!dates || dates.length === 0) return 0;
  const sorted = [...dates].sort().reverse();
  let streak = 1;
  const today = fmtDate(new Date()), yesterday = fmtDate(new Date(Date.now() - 86400000));
  if (sorted[0] !== today && sorted[0] !== yesterday) return 0;
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(sorted[i-1] + 'T00:00:00'), curr = new Date(sorted[i] + 'T00:00:00');
    if ((prev - curr) === 86400000) streak++; else break;
  }
  return streak;
}

  container.innerHTML = `
    <div class="ov-module" onclick="switchToPage('plans')">
      <div class="ov-module-header"><span class="ov-module-title">📋 今日计划</span><span class="ov-module-badge pink">${donePlans.length}/${todayPlans.length}</span></div>
      ${todayPlans.length > 0 ? `
        <div style="margin-bottom:8px"><div style="height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden"><div style="height:100%;width:${planPct}%;background:var(--pink-300);border-radius:3px;transition:width .3s"></div></div><div style="font-size:11px;color:var(--gray-400);margin-top:3px">完成 ${planPct}%</div></div>
        <div class="ov-module-items">${undonePlans.slice(0,3).map(p => `<div class="ov-module-item">${escapeHtml(p.text)}</div>`).join('')}${donePlans.slice(0,2).map(p => `<div class="ov-module-item done">${escapeHtml(p.text)}</div>`).join('')}</div>
      ` : '<div class="ov-module-preview">今天还没有计划</div>'}
    </div>
    <div class="ov-module" onclick="switchToPage('events')">
      <div class="ov-module-header"><span class="ov-module-title">🔔 近期事件</span><span class="ov-module-badge blue">${state.events.filter(e=>e.date>=today).length}</span></div>
      ${upcomingEvents.length > 0 ? `<div class="ov-module-items">${upcomingEvents.map(e => `<div class="ov-module-item">📅 ${e.date.slice(5)} · ${escapeHtml(e.title)}</div>`).join('')}</div>` : '<div class="ov-module-preview">暂无近期事件</div>'}
    </div>
    <div class="ov-module" onclick="switchToPage('checkins')">
      <div class="ov-module-header"><span class="ov-module-title">✅ 打卡</span><span class="ov-module-badge green">${checkinHabits.length} 项</span></div>
      ${checkinHabits.length > 0 ? `<div class="ov-module-items">${checkinHabits.map(h => `<div class="ov-module-item">🔥 ${escapeHtml(h.name)} · 连续 ${calcStreak(h.dates)} 天</div>`).join('')}</div>` : '<div class="ov-module-preview">还没有打卡习惯</div>'}
    </div>
    <div class="ov-module" style="text-align:center;padding:20px">
      <div style="font-size:28px;font-weight:300;letter-spacing:-1px" id="ovClock">--:--</div>
      <div style="font-size:12px;color:var(--gray-400);margin-top:4px" id="ovDate">----年--月--日 星期-</div>
    </div>`;
  updateClock();
  renderOvStats();
}

function switchToPage(page) {
  state.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(`#page-${page}`).classList.add('active');
  $$('.nav-item, .mobile-nav-item').forEach(b => { b.classList.toggle('active', b.dataset.page === page); });
  if (page === 'overview') { renderCalendar(); renderOvStats(); renderOverviewModules(); updateClock(); }
  if (page === 'plans') { state.planSelectedDate = fmtDate(new Date()); renderPlanPage(); }
  if (page === 'events') renderEventPage();
  if (page === 'checkins') renderCheckinPage();
}

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0'), m = String(now.getMinutes()).padStart(2,'0');
  const days = ['日','一','二','三','四','五','六'];
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;
  const ovClock = $('#ovClock'), ovDate = $('#ovDate');
  if (ovClock) ovClock.textContent = `${h}:${m}`;
  if (ovDate) ovDate.textContent = dateStr;
}
setInterval(updateClock, 10000);

// ============================================================
// WIDGET
// ============================================================
function renderWidgetPanel() {
  const today = fmtDate(new Date());
  $('#wPlans').innerHTML = '';
  const todayPlans = state.plans.filter(p => p.date === today);
  if (todayPlans.length === 0) $('#wPlans').innerHTML = '<li style="color:var(--gray-400);background:transparent">暂无计划</li>';
  else todayPlans.forEach(p => { const li = document.createElement('li'); if (p.done) li.className = 'done'; li.textContent = p.text; $('#wPlans').appendChild(li); });
  $('#wEvents').innerHTML = '';
  const upcoming = state.events.filter(e => e.date >= today).slice(0,3);
  if (upcoming.length === 0) $('#wEvents').innerHTML = '<li style="color:var(--gray-400);background:transparent">暂无事件</li>';
  else upcoming.forEach(e => { const li = document.createElement('li'); li.textContent = `${e.date.slice(5)} ${e.title}`; $('#wEvents').appendChild(li); });
}

// ============================================================
// SETTINGS
// ============================================================
function openSettings() {
  const cfg = JSON.parse(localStorage.getItem(LS_KEYS.config) || '{}');
  $('#supabaseUrl').value = cfg.url || '';
  $('#supabaseKey').value = cfg.key || '';
  $('#settingsOverlay').classList.remove('hidden');
}

$('#btnSettings').addEventListener('click', openSettings);
$('#btnSettingsDesktop').addEventListener('click', openSettings);
$('#btnSettingsClose').addEventListener('click', () => $('#settingsOverlay').classList.add('hidden'));
$('#settingsOverlay').addEventListener('click', e => { if (e.target === $('#settingsOverlay')) $('#settingsOverlay').classList.add('hidden'); });

$('#btnSettingsSave').addEventListener('click', () => {
  const cfg = { url: $('#supabaseUrl').value.trim(), key: $('#supabaseKey').value.trim() };
  localStorage.setItem(LS_KEYS.config, JSON.stringify(cfg));
  if (cfg.url && cfg.key) {
    initSupabase();
    setSyncStatus('syncing', '同步中...');
    testConnection();
  } else {
    supabase = null; syncEnabled = false;
    setSyncStatus('offline', '仅本地');
  }
  $('#settingsOverlay').classList.add('hidden');
});

$('#btnClearData').addEventListener('click', () => {
  if (confirm('确定清除所有本地数据？不可恢复！')) {
    Object.values(LS_KEYS).forEach(k => localStorage.removeItem(k));
    state = { ...state, plans: [], events: [], checkins: [], links: [] };
    renderAll();
    $('#settingsOverlay').classList.add('hidden');
  }
});

// ============================================================
// TEST CONNECTION BUTTONS
// ============================================================
$('#syncTestBtnDesktop').addEventListener('click', testConnection);
$('#syncTestBtnMobile').addEventListener('click', testConnection);

// ============================================================
// PWA / HELPERS
// ============================================================
function registerSW() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getDomain(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch(e) { return url; }
}

function getDomainInitial(url) {
  try { return new URL(url).hostname.replace('www.','').charAt(0).toUpperCase(); } catch(e) { return '?'; }
}

document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    // Cmd+S no longer saves notes (notes module removed)
  }
});

// ============================================================
// BOOT
// ============================================================
init();
</script>
</body>
</html>
